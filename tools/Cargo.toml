[workspace]
resolver = "2"
members = [
  "archiver",
  "cli",
  "shaderbuild",
  "semantic-shaderbuild",
  "rendering-configuration-compiler",
  "rendering-configuration-reader",
  "model-info",
]

[workspace.dependencies]
bedrock = { git = "https://github.com/Pctg-x8/bedrock", branch = "peridot" }
clap = "4.5"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
manual_div_ceil = "allow"
needless_lifetimes = "allow"
manual_async_fn = "allow"
upper_case_acronyms = "allow"

# defaultは基本使わない方針なのでそれ関係のlintは無視する
unwrap_or_default = "allow"
new_without_default = "allow"
mem_replace_with_default = "allow"
