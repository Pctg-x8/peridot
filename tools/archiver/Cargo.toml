[package]
name = "peridot-archiver"
version = "0.1.0"
authors = ["S.Percentage <Syn.Tri.Naga@gmail.com>"]
edition = "2021"

[dependencies]
peridot-archive = { path = "../../modules/archive", features = [
    "async-rt-async-std",
] }
async-std = { version = "1.13", features = ["attributes"] }
clap = { workspace = true, features = ["derive"] }
glob = "0.2"
libc = "0.2"
