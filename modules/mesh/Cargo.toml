[package]
name = "peridot-mesh"
version = "0.1.0"
edition = "2024"

[features]
default = []
with-loader-impl = ["dep:peridot"]
with-peridot = ["dep:peridot", "with-loader-impl"]

[dependencies]
bedrock.workspace = true
futures-io.workspace = true
pinned-futures-helper.path = "../../base-lib/pinned-futures-helper"

peridot = { path = "../../base", optional = true }
peridot-types = { path = "../../base-types" }

[lints]
workspace = true
