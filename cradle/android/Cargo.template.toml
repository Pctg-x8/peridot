[package]
name = "peridot-cradle-android"
version = "0.1.0"
authors = ["S.Percentage <Syn.Tri.Naga@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "pegamelib"

[features]
debug = ["peridot/debug"]
mt = ["peridot/mt"]

[dependencies]
peridot = { path = "../../base" }
bedrock = { git = "https://github.com/Pctg-x8/bedrock", branch = "peridot", features = [
    "Implements",
    "Presentation",
    "VK_KHR_android_surface",
    "DynamicLoaded",
] }
android = { git = "https://github.com/Pctg-x8/android-defs-rs", features = [
    "autolink-libandroid",
] }
log = "0.4"
libc = "0.2"
android_logger = "0.5"
libloading = "0.5"
oboe = "0.4"
jni = "0.15"
async-std = "1.13.0"
tracing-android = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["registry"] }
tracing = "0.1.40"
thiserror = "2.0"
