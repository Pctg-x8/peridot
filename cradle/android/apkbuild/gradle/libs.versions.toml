[versions]
androidGradlePlugin = "8.7.0"
kotlinGradlePlugin = "2.0.21"
appCompat = "28.0.0"
androidSupport = "1.1.3"

[plugins]
android-app = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinGradlePlugin" }

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk7", version.ref = "kotlinGradlePlugin" }
android-support-constraintLayout = { group = "com.android.support.constraint", name = "constraint-layout", version.ref = "androidSupport" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version = "2.8.7" }
