[package]
name = "peridot-cradle-windows"
version = "0.1.0"
authors = ["S.Percentage <Syn.Tri.Naga@gmail.com>"]
edition = "2021"
build = "build.rs"

[features]
UseExternalAssetPath = []
transparent = [
    "widestring",
    "bedrock/VK_KHR_external_memory_win32",
    "bedrock/VK_KHR_external_semaphore_win32",
    "windows/Win32_Graphics_DirectComposition",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D12",
    "windows/Win32_System_SystemServices",
    "windows/Win32_System_WindowsProgramming",
]
IterationBuild = []
debug = ["peridot/debug"]
mt = ["peridot/mt"]

[dependencies]
bedrock = { git = "https://github.com/Pctg-x8/bedrock", branch = "peridot", features = [
    "Presentation",
    "Implements",
    "VK_KHR_win32_surface",
    "VK_KHR_display",
    "VK_NV_acquire_winrt_display",
    "VK_KHR_external_memory_capabilities",
] }
peridot = { path = "../../base" }
log = "0.4"
env_logger = "0.5"
rayon = "1.0"
num_cpus = "1.0"
widestring = { version = "1.1", optional = true }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-std = { version = "1.13.0", features = ["attributes"] }
toml = "0.8"
thiserror = "2.0"

[dependencies.windows]
version = "0.51"
features = [
    'Win32_Foundation',
    'Win32_System_LibraryLoader',
    'Win32_System_Com',
    'Win32_Graphics_Gdi',
    'Win32_UI_WindowsAndMessaging',
    'Win32_UI_HiDpi',
    'Win32_Media_Audio',
    'Win32_UI_Shell_PropertiesSystem',
    "Win32_Security",
    'Win32_System_Com_StructuredStorage',
    'Win32_System_Threading',
    "Win32_System_Variant",
    'Win32_Devices_FunctionDiscovery',
    'Win32_Media_KernelStreaming',
    'Win32_Media_Multimedia',
    'Win32_UI_Input',
    'Win32_UI_Input_KeyboardAndMouse',
    'Win32_UI_Input_XboxController',
    "Devices_Display_Core",
    "Foundation_Collections",
    "Graphics",
    "Win32_Devices_Display",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
    "Win32_Devices_Properties",
]
