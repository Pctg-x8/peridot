[package]
name = "peridot-cradle-mac"
version = "0.1.0"
authors = ["S.Percentage <Syn.Tri.Naga@gmail.com>"]
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["staticlib"]
name = "pegamelib"

[features]
UseExternalAssetPath = []
debug = ["peridot/debug"]
mt = ["peridot/mt"]

[dependencies]

bedrock = { git = "https://github.com/Pctg-x8/bedrock", branch = "peridot", features = [
    "VK_KHR_surface",
    "VK_KHR_swapchain",
    "Implements",
    "VK_EXT_metal_surface",
] }
peridot = { path = "../../base" }
peridot-archive = { path = "../../modules/archive" }
parking_lot = "0.12"
tracing = { version = "0.1.37", features = ["log"] }
tracing-subscriber = { version = "0.3.17", features = ["fmt", "env-filter"] }
async-std = "1.13.0"
thiserror = "2.0"
