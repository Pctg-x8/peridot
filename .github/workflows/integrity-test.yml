        with:
          key: "${{ runner.os }}-ccache"
          path: "~\\AppData\\Roaming\\ccache"
      - if: "${{ needs.preconditions.outputs.has_code_changes == 1 }}"
        name: Install ccache
        run: choco install ccache
      - if: "${{ needs.preconditions.outputs.has_code_changes == 1 }}"
        name: "Pre-build c deps(slang)"
        run: "call \"C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvarsall.bat\" x64 && cmake --preset default -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DSLANG_ENABLE_SLANG_RHI=FALSE -DSLANG_ENABLE_GFX=FALSE -DSLANG_ENABLE_SLANGD=FALSE -DSLANG_ENABLE_SLANGC=FALSE -DSLANG_ENABLE_SLANGI=FALSE -DSLANG_ENABLE_SLANGRT=FALSE -DSLANG_ENABLE_TESTS=FALSE -DSLANG_ENABLE_EXAMPLES=FALSE && cmake --build --preset releaseWithDebugInfo"
