        name: "Pre-build c deps(ktx)"
        run: "call \"C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\Enterprise\\VC\\Auxiliary\\Build\\vcvarsall.bat\" x64 && cmake . -B build -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DKTX_FEATURE_TESTS=OFF -DKTX_FEATURE_VK_UPLOAD=OFF -DKTX_FEATURE_GL_UPLOAD=OFF -DKTX_FEATURE_TOOLS=OFF && cmake --build build"
        working-directory: thirdparty/ktx/source-repo
      - if: "${{ needs.preconditions.outputs.has_code_changes == 1 }}"
        name: Build CLI
        run: cargo build
        working-directory: "./tools/cli"
      - if: "${{ needs.preconditions.outputs.has_code_changes == 1 }}"
        name: Copy thirdparty DLLs
        run: "Copy-Item -Path thirdparty/ktx/source-repo/build/Debug/ktx.dll -Destination tools/target/debug/ktx.dll\nCopy-Item -Path thirdparty/slang/source-repo/build/RelWithDebInfo/bin/slang.dll -Destination tools/target/debug/slang.dll\nCopy-Item -Path thirdparty/slang/source-repo/build/RelWithDebInfo/bin/slang-glslang.dll -Destination tools/target/debug/slang-glslang.dll"
      - env:
          PERIDOT_CLI_BUILTIN_ASSETS_PATH: "${{ format('{0}/builtin-assets', github.workspace) }}"
          PERIDOT_CLI_CRADLE_BASE: "${{ format('{0}/cradle', github.workspace) }}"
          VK_SDK_PATH: ''
        if: "${{ needs.preconditions.outputs.has_code_changes == 1 }}"
        name: cargo check
        run: "$ErrorActionPreference = \"Continue\"\npwsh -c 'tools/target/debug/peridot test examples/image-plane -p windows -F bedrock/DynamicLoaded' *>&1 | Tee-Object $Env:GITHUB_WORKSPACE/.buildlog"
      - env:
          PERIDOT_CLI_BUILTIN_ASSETS_PATH: "${{ format('{0}/builtin-assets', github.workspace) }}"
          PERIDOT_CLI_CRADLE_BASE: "${{ format('{0}/cradle', github.workspace) }}"
