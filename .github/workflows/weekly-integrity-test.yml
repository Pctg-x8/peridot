          restore-keys: "${{ runner.os }}-cargo-"
      - if: 'true'
        name: Setup cargo-json-gha-translator
        run: "mkdir -p $HOME/.local/bin\ncurl -o $HOME/.local/bin/cargo-json-gha-translator -L https://github.com/Pctg-x8/cargo-json-gha-translator/releases/download/v0.1.3/cargo-json-gha-translator\nchmod +x $HOME/.local/bin/cargo-json-gha-translator"
      - env:
          PERIDOT_BUILD_SKIP_CDEPS: '1'
        if: 'true'
        name: Run checks
        run: "exec $GITHUB_WORKSPACE/.github/scripts/checkbuild-subdir.sh"
        working-directory: tools
      - if: "failure()"
        uses: "actions/checkout@v5"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: Tools
          mode: branch
          report_name: Weekly Check
          status: failure
  preconditions:
    name: Preconditions
    outputs:
      begintime: "${{ steps.begintime.outputs.begintime }}"
    runs-on: ubuntu-latest
    steps:
      - id: begintime
        name: Getting begintime
        run: "echo \"begintime=$(date +%s)\" >> $GITHUB_OUTPUT"
  report-success:
    name: Report as Success
    needs:
      - check-baselayer
      - check-cradle-android
      - check-cradle-linux
      - check-cradle-macos
      - check-cradle-windows
      - check-examples
      - check-formats
      - check-modules
      - check-tools
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
      - name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - name: Notify as Success
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          mode: branch
          report_name: Weekly Check
          status: success
name: "Integrity Check (Weekly)"
on:
  schedule:
    - cron: "0 12 * * wed"
