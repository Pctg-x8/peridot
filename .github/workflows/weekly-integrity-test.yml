        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget"
      - if: 'true'
        name: Build CLI
        run: cargo build
        working-directory: "./tools/cli"
      - if: 'true'
        name: Build archiver
        run: cargo build
        working-directory: "./tools/archiver"
      - if: 'true'
        name: Install requirements
        run: brew install coreutils
      - env:
          LD_LIBRARY_PATH: "${{ format('{0}/thirdparty/slang/source-repo/build/RelWithDebInfo/lib:{1}', github.workspace, env.LD_LIBRARY_PATH) }}"
          PERIDOT_CLI_ARCHIVER_PATH: "${{ format('{0}/tools/target/debug/peridot-archiver', github.workspace) }}"
          PERIDOT_CLI_BUILTIN_ASSETS_PATH: "${{ format('{0}/builtin-assets', github.workspace) }}"
          PERIDOT_CLI_CRADLE_BASE: "${{ format('{0}/cradle', github.workspace) }}"
          VULKAN_SDK: /Users
        if: 'true'
        name: cargo check
        run: "./tools/target/debug/peridot check examples/image-plane -p mac 2>&1 | tee $GITHUB_WORKSPACE/.buildlog"
        shell: bash
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: "Cradle(macOS)"
          mode: branch
          report_name: Weekly Check
          status: failure
  check-cradle-windows:
    name: "Cradle(Windows)"
    needs:
      - check-baselayer
      - check-examples
      - check-modules
      - check-tools
      - preconditions
    permissions:
      id-token: write
    runs-on: windows-latest
    steps:
      - if: 'true'
        name: "Checking out (HEAD commit)"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          submodules: recursive
      - if: 'true'
        name: Checking out
        uses: "actions/checkout@v4"
        with:
          submodules: recursive
      - if: 'true'
        name: Initialize Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget"
      - if: 'true'
        name: Build CLI
        run: cargo build
        working-directory: "./tools/cli"
      - env:
          LD_LIBRARY_PATH: "${{ format('{0}/thirdparty/slang/source-repo/build/RelWithDebInfo/lib:{1}', github.workspace, env.LD_LIBRARY_PATH) }}"
          PERIDOT_CLI_BUILTIN_ASSETS_PATH: "${{ format('{0}/builtin-assets', github.workspace) }}"
          PERIDOT_CLI_CRADLE_BASE: "${{ format('{0}/cradle', github.workspace) }}"
          VK_SDK_PATH: ''
        if: 'true'
        name: cargo check
        run: "$ErrorActionPreference = \"Continue\"\npwsh -c 'tools/target/debug/peridot test examples/image-plane -p windows -F bedrock/DynamicLoaded' *>&1 | Tee-Object $Env:GITHUB_WORKSPACE/.buildlog"
      - env:
          LD_LIBRARY_PATH: "${{ format('{0}/thirdparty/slang/source-repo/build/RelWithDebInfo/lib:{1}', github.workspace, env.LD_LIBRARY_PATH) }}"
          PERIDOT_CLI_BUILTIN_ASSETS_PATH: "${{ format('{0}/builtin-assets', github.workspace) }}"
          PERIDOT_CLI_CRADLE_BASE: "${{ format('{0}/cradle', github.workspace) }}"
          VK_SDK_PATH: ''
        if: 'true'
        name: cargo check for transparent-back
        run: "$ErrorActionPreference = \"Continue\"\npwsh -c 'tools/target/debug/peridot test examples/image-plane -p windows -F transparent -F bedrock/DynamicLoaded' *>&1 | Tee-Object $Env:GITHUB_WORKSPACE/.buildlog"
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: "Cradle(Windows)"
          mode: branch
          report_name: Weekly Check
          status: failure
  check-examples:
    name: Examples
    needs:
      - check-modules
      - check-baselayer
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - if: 'true'
        name: "Checking out (HEAD commit)"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          submodules: recursive
      - if: 'true'
        name: Checking out
        uses: "actions/checkout@v4"
        with:
          submodules: recursive
      - if: 'true'
        name: Initialize Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget"
      - if: 'true'
        name: Setup cargo-json-gha-translator
        run: "mkdir -p $HOME/.local/bin && curl -o $HOME/.local/bin/cargo-json-gha-translator -L https://github.com/Pctg-x8/cargo-json-gha-translator/releases/download/v0.1.3/cargo-json-gha-translator && chmod +x $HOME/.local/bin/cargo-json-gha-translator"
      - if: 'true'
        name: check
        run: "exec $GITHUB_WORKSPACE/.github/scripts/checkbuild-subdir.sh"
        working-directory: examples
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: Examples
          mode: branch
          report_name: Weekly Check
          status: failure
  check-formats:
    name: Code Formats
    needs:
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - if: 'true'
        name: "Checking out (HEAD commit)"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          submodules: recursive
      - if: 'true'
        name: Checking out
        uses: "actions/checkout@v4"
        with:
          submodules: recursive
      - if: 'true'
        name: Initialize Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget"
      - if: 'true'
        name: Setup cargo-json-gha-translator
        run: "mkdir -p $HOME/.local/bin && curl -o $HOME/.local/bin/cargo-json-gha-translator -L https://github.com/Pctg-x8/cargo-json-gha-translator/releases/download/v0.1.3/cargo-json-gha-translator && chmod +x $HOME/.local/bin/cargo-json-gha-translator"
      - if: 'true'
        name: Running Rustfmt
        run: cargo fmt -- --check
      - if: 'true'
        name: Running Clippy
        run: "set -o pipefail; cargo clippy --all-features --all-targets --message-format=json | $HOME/.local/bin/cargo-json-gha-translator"
      - if: 'true'
        name: Running Check - Trailing Newline for Source Code Files
        run: "exec $GITHUB_WORKSPACE/.github/scripts/trailing_newline_checker.sh"
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: Code Formats
          mode: branch
          report_name: Weekly Check
          status: failure
