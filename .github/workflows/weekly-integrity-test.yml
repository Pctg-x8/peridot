      - if: 'true'
        name: Setup cargo-json-gha-translator
        run: "mkdir -p $HOME/.local/bin && curl -o $HOME/.local/bin/cargo-json-gha-translator -L https://github.com/Pctg-x8/cargo-json-gha-translator/releases/download/v0.1.3/cargo-json-gha-translator && chmod +x $HOME/.local/bin/cargo-json-gha-translator"
      - if: 'true'
        name: check
        run: "exec $GITHUB_WORKSPACE/.github/scripts/checkbuild-subdir.sh"
        working-directory: tools
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: Tools
          mode: branch
          report_name: Weekly Check
          status: failure
  preconditions:
    name: Preconditions
    outputs:
      begintime: "${{ steps.begintime.outputs.begintime }}"
    runs-on: ubuntu-latest
    steps:
      - id: begintime
        name: Getting begintime
        run: "echo \"begintime=$(date +%s)\" >> $GITHUB_OUTPUT"
  report-success:
    name: Report as Success
    needs:
      - check-baselayer
      - check-cradle-android
      - check-cradle-linux
      - check-cradle-macos
      - check-cradle-windows
      - check-examples
      - check-formats
      - check-modules
      - check-tools
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checking out
        uses: "actions/checkout@v4"
        with:
          submodules: recursive
      - name: "Checking out (HEAD commit)"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          submodules: recursive
      - name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - name: Notify as Success
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          mode: branch
          report_name: Weekly Check
          status: success
name: "Integrity Check (Weekly)"
on:
  schedule:
    - cron: "0 12 * * wed"
