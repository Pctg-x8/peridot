  check-formats:
    name: Code Formats
    needs:
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - if: 'true'
        name: Checking out
        uses: "actions/checkout@v5"
        with:
          submodules: recursive
      - if: 'true'
        name: Initialize Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/*.rs', '**/Cargo.toml') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget\ntools/target\nexamples/**/target\ncradle/**/target"
          restore-keys: "${{ runner.os }}-cargo-"
      - if: 'true'
        name: Setup cargo-json-gha-translator
        run: "mkdir -p $HOME/.local/bin\ncurl -o $HOME/.local/bin/cargo-json-gha-translator -L https://github.com/Pctg-x8/cargo-json-gha-translator/releases/download/v0.1.3/cargo-json-gha-translator\nchmod +x $HOME/.local/bin/cargo-json-gha-translator"
      - if: 'true'
        name: Run rustfmt
        run: cargo fmt -- --check
      - env:
          PERIDOT_BUILD_SKIP_CDEPS: '1'
        if: 'true'
        name: Run clippy
        run: "cargo clippy --all-features --all-targets --message-format=json | $HOME/.local/bin/cargo-json-gha-translator"
        shell: "bash --noprofile --norc -eo pipefail {0}"
      - if: 'true'
        name: Run check - Trailing Newline for Source Code Files
        run: "exec $GITHUB_WORKSPACE/.github/scripts/trailing_newline_checker.sh"
      - if: "failure()"
        uses: "actions/checkout@v5"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
      - if: "failure()"
        name: Configure for Slack Notification
