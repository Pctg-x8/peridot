jobs:
  check-baselayer:
    name: Base Layer
    needs:
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - if: 'true'
        name: "Checking out (HEAD commit)"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          submodules: recursive
      - if: 'true'
        name: Checking out
        uses: "actions/checkout@v4"
        with:
          submodules: recursive
      - if: 'true'
        name: Initialize Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget"
      - if: 'true'
        name: Setup cargo-json-gha-translator
        run: "mkdir -p $HOME/.local/bin && curl -o $HOME/.local/bin/cargo-json-gha-translator -L https://github.com/Pctg-x8/cargo-json-gha-translator/releases/download/v0.1.3/cargo-json-gha-translator && chmod +x $HOME/.local/bin/cargo-json-gha-translator"
      - if: 'true'
        name: check
        run: "set -o pipefail; cargo check --package peridot --verbose --features=bedrock/VK_EXT_debug_report --message-format=json | $HOME/.local/bin/cargo-json-gha-translator"
      - if: 'true'
        name: "check(mt)"
        run: "set -o pipefail; cargo check --package peridot --verbose --features=bedrock/VK_EXT_debug_report,mt --message-format=json | $HOME/.local/bin/cargo-json-gha-translator"
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: Base Layer
          mode: branch
          report_name: Weekly Check
          status: failure
  check-cradle-android:
    name: "Cradle(Android)"
    needs:
      - check-baselayer
      - check-examples
      - check-modules
      - check-tools
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - if: 'true'
        name: "Checking out (HEAD commit)"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          submodules: recursive
      - if: 'true'
        name: Checking out
        uses: "actions/checkout@v4"
        with:
          submodules: recursive
      - if: 'true'
        name: Initialize Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget"
      - if: 'true'
        name: Setup Rust for Android
        uses: "actions-rs/toolchain@v1"
        with:
          target: aarch64-linux-android
          toolchain: stable
      - if: 'true'
        name: Setup Java
        uses: "actions/setup-java@v3"
        with:
          distribution: adopt
          java-version: '17'
      - if: 'true'
        name: install cargo-ndk
        run: cargo install cargo-ndk
      - if: 'true'
        name: Build CLI
        run: cargo build
        working-directory: "./tools/cli"
      - env:
          LD_LIBRARY_PATH: "${{ format('{0}/thirdparty/slang/source-repo/build/RelWithDebInfo/lib:{1}', github.workspace, env.LD_LIBRARY_PATH) }}"
          NDK_PLATFORM_TARGET: '28'
          PERIDOT_CLI_BUILTIN_ASSETS_PATH: "${{ format('{0}/builtin-assets', github.workspace) }}"
          PERIDOT_CLI_CRADLE_BASE: "${{ format('{0}/cradle', github.workspace) }}"
        if: 'true'
        name: cargo check
        run: "./tools/target/debug/peridot check examples/image-plane -p android 2>&1 | tee $GITHUB_WORKSPACE/.buildlog"
        shell: bash
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: "Cradle(Android)"
          mode: branch
          report_name: Weekly Check
          status: failure
  check-cradle-linux:
    name: "Cradle(Linux)"
    needs:
      - check-baselayer
      - check-examples
      - check-modules
      - check-tools
      - preconditions
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - if: 'true'
        name: Add External PPA
        run: sudo apt-add-repository -y ppa:pipewire-debian/pipewire-upstream
      - if: 'true'
        name: Install extra packages
        run: "sudo apt-get update && sudo apt-get install -y libwayland-dev libpipewire-0.3-dev libspa-0.2-dev"
      - if: 'true'
        name: "Checking out (HEAD commit)"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          submodules: recursive
      - if: 'true'
        name: Checking out
        uses: "actions/checkout@v4"
        with:
          submodules: recursive
      - if: 'true'
        name: Initialize Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}"
          path: "~/.cargo/registry\n~/.cargo/git\ntarget"
      - id: llvm-cache
        if: 'true'
        name: Initialize LLVM Cache
        uses: "actions/cache@v4"
        with:
          key: "${{ runner.os }}-llvm-11"
          path: "./llvm"
      - if: 'true'
        name: Install LLVM
        uses: "KyleMayes/install-llvm-action@v1"
        with:
          cached: "${{ steps.llvm-cache.outputs.cache-hit }}"
          version: '11'
      - if: 'true'
        name: Build CLI
        run: cargo build
        working-directory: "./tools/cli"
      - env:
          LD_LIBRARY_PATH: "${{ format('{0}/thirdparty/slang/source-repo/build/RelWithDebInfo/lib:{1}', github.workspace, env.LD_LIBRARY_PATH) }}"
          PERIDOT_CLI_BUILTIN_ASSETS_PATH: "${{ format('{0}/builtin-assets', github.workspace) }}"
          PERIDOT_CLI_CRADLE_BASE: "${{ format('{0}/cradle', github.workspace) }}"
        if: 'true'
        name: cargo check
        run: "./tools/target/debug/peridot check examples/image-plane -p linux 2>&1 | tee $GITHUB_WORKSPACE/.buildlog"
        shell: bash
      - if: "failure()"
        name: Configure for Slack Notification
        uses: "aws-actions/configure-aws-credentials@v4"
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::208140986057:role/GHALambdaInvoker
      - if: "failure()"
        name: Notify as Failure
        uses: "Pctg-x8/ci-notifications-post-invoker@master"
        with:
          begintime: "${{ needs.preconditions.outputs.begintime }}"
          failure_step: "Cradle(Linux)"
          mode: branch
          report_name: Weekly Check
          status: failure
