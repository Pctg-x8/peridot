[package]
name = "peridot-tp-wayland"
version = "0.1.0"
edition = "2024"

[features]
default = []
tracing = ["dep:tracing"]

# wayland extensions as feature
# stable
viewporter = []
xdg-shell = []

# staging
fractional-scale-v1 = []
cursor-shape-v1 = []

# unstable
xdg-decoration-unstable-v1 = []
xdg-foreign-unstable-v2 = []
wlr-output-management-unstable-v1 = []

# external
gtk-shell = []

[dependencies]
bitflags = "2.9.3"
tracing = { version = "0.1", optional = true }
