[package]
name = "peridot-marble-editor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
win32 = ["bedrock/VK_KHR_win32_surface"]

[dependencies]
bedrock = { workspace = true, features = [
    "Implements",
    "VK_KHR_surface",
    "VK_KHR_swapchain",
    "VK_EXT_debug_utils",
    "Allow1_4APIs",
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lyon_geom = "1.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
]

[target.'cfg(windows)'.dependencies]
windows-core = "*"
windows-numerics = "*"

[build-dependencies]
winres = "0.1"

[lints]
workspace = true
