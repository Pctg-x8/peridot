[package]
name = "peridot-marble-editor"
version = "0.1.0"
edition = "2024"

[features]
default = []
win32 = ["bedrock/VK_KHR_win32_surface"]

[dependencies]
bedrock = { workspace = true, features = ["Implements", "VK_KHR_surface", "VK_KHR_swapchain", "VK_EXT_debug_utils"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"]

[lints]
workspace = true
